name: Runtime Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: PYTHONPATH=.:./runtime pytest -q runtime
      - name: Canonical Context Check
        run: |
          grep -q "current_lesson: SYN-P001-L001" runtime/state/SYN-P001.yaml
          grep -q "source_event_id: EVT-SYN-P001-0006" runtime/state/SYN-P001.yaml
          grep -q "EVT-SYN-P001-0006" runtime/events/SYN-P001.md
          grep -q "EVT-SYN-P001-0004" runtime/state/SYN-P001-provenance.yaml
          grep -q "EVT-SYN-P001-0005" runtime/state/SYN-P001-provenance.yaml
          grep -q "SYN-P001-A005" projects/SYN-P001-EJJoftheCloud/deployments/chatgpt/registry.yaml
